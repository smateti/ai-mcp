# =============================================================================
# Build Trigger Service — MicroProfile Config
# =============================================================================
# These defaults work for local development with mock mode enabled.
# Override via environment variables or Kubernetes ConfigMap/Secrets.

# ── GitLab connection ────────────────────────────────────────────────────────
gitlab.url=https://localhost:9043
gitlab.token=glpat-ijpa7igmmgJSiR6LDzxuJG86MQp1OjEH.01.0w1mf1yog
gitlab.mock=false

# Custom truststore for self-signed GitLab certs
gitlab.truststore.path=${server.config.dir}/truststore.p12
gitlab.truststore.password=changeit

# ── GitLab timeouts (ms) ────────────────────────────────────────────────────
gitlab.connect.timeout=5000
gitlab.read.timeout=15000

# ── GitLab trigger repo project IDs ─────────────────────────────────────────
# One project ID per application type (matches the type field in registry.json)
gitlab.trigger-repo.service=2
gitlab.trigger-repo.batch=3
gitlab.trigger-repo.default=2

# ── Pipeline defaults ───────────────────────────────────────────────────────
gitlab.default.ref=main

# ── Target GitLab instance (migration target) ────────────────────────────────
gitlab.target.url=https://localhost:9044
gitlab.target.token=glpat-target-migration-token-001
gitlab.target.trigger-repo.service=2
gitlab.target.trigger-repo.batch=3
gitlab.target.trigger-repo.default=2

# ── CORS ─────────────────────────────────────────────────────────────────────
cors.allowed.origins=*
