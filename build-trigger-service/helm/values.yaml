# Helm values for build-trigger-service
replicaCount: 1

image:
  repository: registry.example.com/platform/build-trigger-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9081
  httpsPort: 9444

route:
  enabled: true
  host: build-trigger.apps.example.com
  tls:
    termination: edge

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

env:
  GITLAB_URL: "https://gitlab.example.com"
  GITLAB_MOCK: "false"
  GITLAB_TRIGGER_REPO_SERVICE: "2"
  GITLAB_TRIGGER_REPO_BATCH: "3"
  CORS_ALLOWED_ORIGINS: "*"

secrets:
  GITLAB_TOKEN: ""
