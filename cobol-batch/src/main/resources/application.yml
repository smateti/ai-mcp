server:
  port: 8081

spring:
  application:
    name: cobol-batch
  elasticsearch:
    uris: http://localhost:9200
  datasource:
    url: jdbc:h2:mem:batchdb
    driver-class-name: org.h2.Driver
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

cobol:
  file-patterns: "*.cbl,*.CBL,*.cob,*.COB,*.cobol"

llm:
  base-url: http://localhost:8000
  analysis-model: granite3.1-8b-instruct
  embedding-model: nomic-embed-text
  timeout-seconds: 180
  temperature: 0.1
  max-tokens: 2048

qdrant:
  url: http://localhost:6333
  collection: cobol-analysis

service:
  url: http://localhost:8082

logging:
  level:
    root: INFO
    com.enterprise.cobol: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
