# =============================================================================
# Local testing harness — docker-compose.yml
# =============================================================================
# Runs the custom runner image with the repository mounted, simulating the
# GitLab CI runner environment.  Variables are loaded from .env.
#
# Usage:
#   cp .env.example .env        # fill in values
#   mkdir -p .secrets            # add settings.xml, ca-bundle.pem, kubeconfig
#   docker-compose run --rm pipeline bash   # interactive shell
#   # or run the full local test:
#   docker-compose run --rm pipeline /workspace/pipeline-templates/local-test/run-local.sh
# =============================================================================

services:
  pipeline:
    # Build from the custom runner Dockerfile
    build:
      context: ../docker
      dockerfile: Dockerfile
    image: pipeline-runner:local

    # Load pipeline variables from .env
    env_file:
      - .env

    # Map secret files to the same paths GitLab CI/CD file variables use.
    # In GitLab, file variables are written to temp files and the variable
    # holds the path.  Here we mount them to fixed paths and set the vars.
    environment:
      - CA_BUNDLE=/run/secrets/ca-bundle.pem
      - MAVEN_SETTINGS=/run/secrets/settings.xml
      - KUBECONFIG=/run/secrets/kubeconfig

    # Mount the entire project so scripts and source are available
    volumes:
      # The full repo — mounted at /workspace (same as GitLab runner workdir)
      - ../../:/workspace
      # Secrets — git-ignored folder with sensitive files
      - ./.secrets/settings.xml:/run/secrets/settings.xml:ro
      - ./.secrets/ca-bundle.pem:/run/secrets/ca-bundle.pem:ro
      - ./.secrets/kubeconfig:/run/secrets/kubeconfig:ro

    working_dir: /workspace

    # Keep the container running for interactive use
    stdin_open: true
    tty: true
