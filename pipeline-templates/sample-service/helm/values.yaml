# =============================================================================
# Base values — defaults shared across all environments.
# Environment-specific overrides live in values-dev.yaml, values-prod.yaml, etc.
# The pipeline merges these via generate_helm_values.py → values-final.yaml.
# =============================================================================

replicaCount: 1

image:
  repository: registry.example.com/services/hello-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9080

route:
  enabled: true
  host: hello.apps.ocp.example.com
  tls:
    termination: edge

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

health:
  readiness:
    path: /health/ready
    port: 9080
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    path: /health/live
    port: 9080
    initialDelaySeconds: 30
    periodSeconds: 15

config:
  appName: hello-service
  appEnvironment: local
  appVersion: "1.0.0-SNAPSHOT"

labels: {}
