# =============================================================================
# service-pipeline.yml — Reusable GitLab CI/CD pipeline for "service" type apps
# =============================================================================
# Included by each application-type trigger repo via `include:`.
# Expects two pipeline variables: APP_NAME and ENVIRONMENT.
# All heavy logic lives in Python scripts and Maven — this YAML is a
# "traffic controller" that sequences stages and manages artifacts.
# =============================================================================

# ── Default job image ────────────────────────────────────────────────────────
# In production, use the custom runner image built from docker/Dockerfile.
# For local/demo use, maven:3.9-eclipse-temurin-21 + pip provides Java + Python.
default:
  image: maven:3.9-eclipse-temurin-21

# ── Stages ───────────────────────────────────────────────────────────────────
# Defines the execution order; jobs are assigned to stages below.
stages:
  - prepare
  - build
  - test
  - package
  - deploy
  - post-deploy

# ── Global variables ────────────────────────────────────────────────────────
variables:
  # Maven cache location — must be inside $CI_PROJECT_DIR so Docker runners
  # can cache it between jobs (GitLab caches only work inside the project dir).
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dhttps.protocols=TLSv1.2
    -Dorg.slf4j.simpleLogger.showDateTime=true
  # Sensible Maven CLI defaults for CI (non-interactive, batch mode).
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  # Container image coordinates — uses GitLab's built-in Container Registry.
  IMAGE_TAG: "$CI_REGISTRY_IMAGE/$APP_NAME:$CI_PIPELINE_ID"
  TEMPLATES_REF: "main"
  # Internal GitLab hostname reachable from runner containers.  Override this
  # if your runner uses a different network or DNS name for GitLab.
  # In production (where external_url matches the network-reachable name),
  # set this to the same value as CI_SERVER_HOST.
  GITLAB_INTERNAL_URL: "https://gitlab:9043"
  # Disable git SSL verification for self-signed certs in local/dev GitLab.
  GIT_SSL_NO_VERIFY: "true"

# ── Global cache ────────────────────────────────────────────────────────────
# Caches the local Maven repo across pipelines. The key includes the
# lock-file hash so the cache busts when dependencies change.
cache:
  key:
    files:
      - "**/pom.xml"           # bust cache when any pom changes
    prefix: maven
  paths:
    - .m2/repository           # must match maven.repo.local above
  policy: pull-push            # download at start, upload at end

# ── Global before_script ────────────────────────────────────────────────────
# Runs before every job.  Handles runtime cert injection and settings.xml
# so each job trusts internal HTTPS endpoints and reaches Nexus.
#
# WHY runtime injection instead of baking into the image?
#   - Certs rotate; we don't want to rebuild runner images on every rotation.
#   - Different environments may have different CAs.
#   - CI/CD file-variables are managed centrally in GitLab project settings.
before_script:
  # ── Install Python + pip if missing ────────────────────────────────────
  # The custom runner image (UBI 9) has Python pre-installed.  When using
  # the default maven:3.9-eclipse-temurin-21 image (Debian), install it.
  - |
    if ! command -v python3 >/dev/null 2>&1; then
      echo "Installing Python 3 + pip..."
      apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv >/dev/null
    fi
    python3 -m pip install --quiet pyyaml 2>/dev/null || pip3 install --quiet pyyaml 2>/dev/null || true
  # ── Certificate injection ──────────────────────────────────────────────
  # $CA_BUNDLE is a GitLab CI/CD file variable (type: File) containing one
  # or more PEM-encoded CA certificates.
  - |
    if [ -n "${CA_BUNDLE:-}" ] && [ -f "$CA_BUNDLE" ]; then
      echo "Injecting CA certificates from \$CA_BUNDLE..."
      # Detect OS family and use the correct trust store path
      if [ -d /etc/pki/ca-trust ]; then
        # RHEL / UBI
        cp "$CA_BUNDLE" /etc/pki/ca-trust/source/anchors/custom-ca.pem
        update-ca-trust extract
      else
        # Debian / Ubuntu
        cp "$CA_BUNDLE" /usr/local/share/ca-certificates/custom-ca.crt
        update-ca-certificates
      fi
      # JVM trust store (used by Maven, Liberty, etc.)
      keytool -importcert -noprompt \
        -alias custom-ca \
        -file "$CA_BUNDLE" \
        -cacerts \
        -storepass changeit 2>/dev/null || echo "CA already in JVM truststore"
    else
      echo "No CA_BUNDLE variable set; skipping cert injection."
    fi
  # ── Maven settings.xml injection ───────────────────────────────────────
  # $MAVEN_SETTINGS is a GitLab CI/CD file variable (type: File) containing
  # a settings.xml that defines a Nexus mirror and credentials.
  - |
    if [ -n "${MAVEN_SETTINGS:-}" ] && [ -f "$MAVEN_SETTINGS" ]; then
      echo "Injecting Maven settings.xml..."
      mkdir -p "$HOME/.m2"
      cp "$MAVEN_SETTINGS" "$HOME/.m2/settings.xml"
    else
      echo "No MAVEN_SETTINGS variable set; using default settings."
    fi

# =============================================================================
# STAGE: prepare
# =============================================================================
# Looks up application metadata from the registry and generates config files
# that downstream jobs consume as artifacts.
prepare:
  stage: prepare
  script:
    - echo "=== Prepare stage for APP_NAME=$APP_NAME ENVIRONMENT=$ENVIRONMENT ==="
    # Clone the pipeline-templates repo so scripts, registry, and sample source
    # are available.  `include:` only imports the YAML — not the rest of the repo.
    # Uses the CI job token for authentication (no extra credentials needed).
    # We derive the base URL from CI_REPOSITORY_URL (which the runner already
    # rewrites to use clone_url, so it works in Docker-in-Docker setups).
    - |
      if [ ! -d "pipeline-templates" ]; then
        echo "Cloning pipeline-templates repo..."
        git clone --depth 1 --branch "$TEMPLATES_REF" \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_INTERNAL_URL#https://}/platform/pipeline-templates.git" \
          pipeline-templates
      fi
    - python3 pipeline-templates/scripts/lookup_registry.py
    - echo "--- app-metadata.json ---"
    - cat app-metadata.json
    - echo "--- build.properties ---"
    - cat build.properties
  # Artifacts persist files between jobs (replacing the Jenkins workspace).
  # `when: always` ensures artifacts are uploaded even on failure — critical
  # for debugging broken pipelines.
  artifacts:
    paths:
      - app-metadata.json        # full app metadata for all downstream jobs
      - build.properties         # flat key=value pairs for Maven / ConfigMaps
      - pipeline-templates/      # scripts + registry + sample source for downstream jobs
    when: always                 # upload even on failure so devs can debug
    expire_in: 7 days            # auto-cleanup; adjust per retention policy

# =============================================================================
# STAGE: build
# =============================================================================
# Clones the application source and runs `mvn package -DskipTests`.
# Consumes artifacts from `prepare` via `dependencies:`.
build:
  stage: build
  # `dependencies` limits which prior jobs' artifacts are downloaded.
  # Without this, ALL prior artifacts are downloaded — wasteful and fragile.
  dependencies:
    - prepare
  script:
    - echo "=== Build stage ==="
    # Read coordinates from the metadata written by prepare
    - export SERVICE_REPO=$(python3 -c "import json; m=json.load(open('app-metadata.json')); print(m['services'][0]['gitRepo'])")
    - export SERVICE_REF=$(python3 -c "import json; m=json.load(open('app-metadata.json')); print(m['services'][0]['gitRef'])")
    - echo "Cloning $SERVICE_REPO @ $SERVICE_REF"
    # In a real pipeline this would clone the service's own repo.  For the
    # sample, the source lives inside the pipeline-templates repo.  We copy
    # it to a top-level directory so all downstream paths work uniformly.
    - |
      if [ ! -d "sample-service" ] && [ -d "pipeline-templates/sample-service" ]; then
        cp -r pipeline-templates/sample-service sample-service
        echo "Copied pipeline-templates/sample-service → sample-service"
      elif [ ! -d "sample-service" ]; then
        echo "[MOCK] Would clone $SERVICE_REPO ref=$SERVICE_REF"
        echo "Skipping clone in sample mode."
      fi
    # Copy build.properties into the Maven resource path so MicroProfile
    # Config can pick it up at runtime.
    - |
      if [ -d "sample-service/src/main/resources/META-INF" ]; then
        cp build.properties sample-service/src/main/resources/META-INF/build.properties
      fi
    # Run Maven build (compile + package, skip tests — they run in the next stage)
    - cd sample-service && mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - app-metadata.json
      - build.properties
      - sample-service/                # full source needed by test + package stages
      - pipeline-templates/            # scripts needed by deploy + post-deploy
    when: always
    expire_in: 7 days

# =============================================================================
# STAGE: test
# =============================================================================
# Runs unit tests via Maven.  Separate from build so a fast compile gives
# early feedback, and slow tests don't block the build artifact upload.
test:
  stage: test
  dependencies:
    - build
  script:
    - echo "=== Test stage ==="
    - cd sample-service && mvn $MAVEN_CLI_OPTS test
  # JUnit reports — GitLab parses these and shows test results in the MR UI.
  artifacts:
    paths:
      - sample-service/target/surefire-reports/
    reports:
      junit: sample-service/target/surefire-reports/TEST-*.xml  # GitLab MR test widget
    when: always
    expire_in: 7 days

# =============================================================================
# STAGE: package
# =============================================================================
# Builds the container image with buildah (rootless, no Docker-in-Docker,
# no privileged mode — safe for OpenShift runners) and pushes to GitLab
# Container Registry.
package:
  stage: package
  dependencies:
    - build
  script:
    - echo "=== Package stage ==="
    - 'echo "Building container image: $IMAGE_TAG"'
    # Log in to the GitLab Container Registry using predefined CI variables.
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Build using the Dockerfile at sample-service root.
    # --format=docker ensures compatibility with OCP internal registry.
    - |
      buildah bud \
        --format=docker \
        --layers \
        -t "$IMAGE_TAG" \
        -f sample-service/Dockerfile \
        sample-service/
    # Push to registry
    - buildah push "$IMAGE_TAG"
    - 'echo "Image pushed: $IMAGE_TAG"'
    # Write image ref for downstream deploy job
    - echo "IMAGE_TAG=$IMAGE_TAG" > image-ref.env
  artifacts:
    paths:
      - image-ref.env                  # consumed by deploy stage
    # `reports: dotenv` loads variables from the file into subsequent jobs
    # so $IMAGE_TAG is available without parsing.
    reports:
      dotenv: image-ref.env            # auto-load vars into deploy job
    when: always
    expire_in: 7 days
  # rules: only run when we actually want to push an image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
      when: on_success                 # only package when triggered properly

# =============================================================================
# STAGE: deploy
# =============================================================================
# Generates final Helm values and deploys to OpenShift via `helm upgrade`.
deploy:
  stage: deploy
  dependencies:
    - prepare                          # for app-metadata.json
    - package                          # for image-ref.env / IMAGE_TAG
  script:
    - echo "=== Deploy stage to $ENVIRONMENT ==="
    # Generate merged Helm values
    - python3 pipeline-templates/scripts/generate_helm_values.py sample-service/helm/values.yaml
    - echo "--- values-final.yaml ---"
    - cat values-final.yaml
    # Log in to OpenShift (uses a CI/CD variable with a service-account token)
    - |
      echo "Logging into OpenShift cluster for $ENVIRONMENT..."
      oc login --token="$OCP_TOKEN" --server="$OCP_API_URL" --insecure-skip-tls-verify=false 2>/dev/null || \
        echo "[MOCK] oc login skipped (no cluster available)"
    # Deploy with Helm
    - |
      NAMESPACE="${APP_NAME}-${ENVIRONMENT}"
      echo "Deploying to namespace: $NAMESPACE"
      helm upgrade --install "${APP_NAME}" \
        sample-service/helm/ \
        --namespace "$NAMESPACE" \
        --create-namespace \
        --values values-final.yaml \
        --set image.repository="$CI_REGISTRY_IMAGE/$APP_NAME" \
        --set image.tag="$CI_PIPELINE_ID" \
        --wait \
        --timeout 300s \
        2>/dev/null || echo "[MOCK] helm upgrade skipped (no cluster available)"
    # Write deployment receipt
    - |
      python3 -c "
      import json, os
      receipt = {
        'appName': os.environ.get('APP_NAME',''),
        'environment': os.environ.get('ENVIRONMENT',''),
        'imageTag': os.environ.get('IMAGE_TAG',''),
        'namespace': f\"{os.environ.get('APP_NAME','')}-{os.environ.get('ENVIRONMENT','')}\",
        'pipelineId': os.environ.get('CI_PIPELINE_ID',''),
      }
      with open('deploy-receipt.json','w') as f:
        json.dump(receipt, f, indent=2)
      print('Wrote deploy-receipt.json')
      "
  artifacts:
    paths:
      - values-final.yaml              # for debugging / auditing
      - deploy-receipt.json            # consumed by post-deploy
    when: always
    expire_in: 30 days                 # keep deploy artifacts longer for audits
  # `environment:` tells GitLab to track this deployment — visible in
  # Operations > Environments.  The URL shows up as a clickable link in MRs.
  environment:
    name: $ENVIRONMENT                 # dynamic: dev, staging, prod
    url: https://${APP_NAME}-${ENVIRONMENT}.apps.ocp.example.com
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
      when: on_success

# =============================================================================
# STAGE: post-deploy
# =============================================================================
# Creates supporting resources (queues, listeners) after the app is deployed.
post-deploy:
  stage: post-deploy
  dependencies:
    - prepare                          # for app-metadata.json
    - deploy                           # for deploy-receipt.json
  script:
    - echo "=== Post-deploy stage ==="
    - python3 pipeline-templates/scripts/post_deploy_resources.py
    - echo "--- resources-created.json ---"
    - cat resources-created.json
  artifacts:
    paths:
      - resources-created.json
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
      when: on_success
