###############################################################################
# orders-api-deployment.yaml — Example OpenShift Deployment for orders-api
#
# Demonstrates both JWT auth and API key auth configurations.
# Choose ONE authentication method per deployment.
#
# The conjur-microprofile-lib auto-detects the auth method based on env vars:
#   - CONJUR_AUTHN_JWT_SERVICE_ID present → JWT auth
#   - CONJUR_AUTHN_API_KEY present → API key auth
###############################################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: apps
  labels:
    app: orders-api
    product: payments
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
        product: payments
        app.kubernetes.io/name: orders-api
    spec:
      serviceAccountName: orders-api-sa
      containers:
      - name: orders-api
        image: image-registry.openshift-image-registry.svc:5000/apps/orders-api:latest
        ports:
        - name: http
          containerPort: 9080
        - name: https
          containerPort: 9443
        env:
        # ===== Conjur connection (common to both auth methods) =====
        - name: CONJUR_APPLIANCE_URL
          value: "https://conjur-server.conjur-system.svc.cluster.local"
        - name: CONJUR_ACCOUNT
          value: "myConjurAccount"

        # ===== Option A: JWT Auth (recommended for OpenShift) =====
        # No K8s Secret needed — uses the pod's ServiceAccount token
        - name: CONJUR_AUTHN_JWT_SERVICE_ID
          value: "openshift"
        - name: CONJUR_JWT_TOKEN_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/token"

        # ===== Option B: API Key Auth (for migration or non-OCP) =====
        # Uncomment these and remove the JWT vars above:
        # - name: CONJUR_AUTHN_LOGIN
        #   valueFrom:
        #     secretKeyRef:
        #       name: conjur-orders-api
        #       key: CONJUR_AUTHN_LOGIN
        # - name: CONJUR_AUTHN_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: conjur-orders-api
        #       key: CONJUR_AUTHN_API_KEY

        # ===== Secret mappings =====
        # Format: configKey=conjurVariablePath
        # The conjur-microprofile-lib resolves these at startup and exposes
        # them as MicroProfile Config properties + System properties.
        - name: CONJUR_SECRETS
          value: >-
            db.url=acme/prod/products/payments/resources/dbs/orders-db/url,
            db.username=acme/prod/products/payments/resources/dbs/orders-db/username,
            db.password=acme/prod/products/payments/resources/dbs/orders-db/password,
            db.port=acme/prod/products/payments/resources/dbs/orders-db/port,
            db.databaseName=acme/prod/products/payments/resources/dbs/orders-db/database-name,
            db.driverClass=acme/prod/products/payments/resources/dbs/orders-db/driver-class,
            kafka.bootstrap.servers=acme/prod/products/payments/resources/kafka/main/bootstrap-servers,
            kafka.sasl.username=acme/prod/products/payments/resources/kafka/main/sasl-username,
            kafka.sasl.password=acme/prod/products/payments/resources/kafka/main/sasl-password,
            kafka.sasl.mechanism=acme/prod/products/payments/resources/kafka/main/sasl-mechanism,
            kafka.security.protocol=acme/prod/products/payments/resources/kafka/main/security-protocol,
            kafka.ssl.keystore.password=acme/prod/products/payments/resources/kafka/main/keystore-password,
            kafka.ssl.truststore.password=acme/prod/products/payments/resources/kafka/main/truststore-password,
            stripe.api.key=acme/prod/products/payments/resources/api/stripe/key,
            stripe.api.secret=acme/prod/products/payments/resources/api/stripe/secret

        # ===== App-specific config =====
        - name: APP_NAME
          value: "orders-api"

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: apps
  labels:
    app: orders-api
spec:
  type: ClusterIP
  selector:
    app: orders-api
  ports:
  - name: http
    port: 9080
    targetPort: 9080
  - name: https
    port: 9443
    targetPort: 9443
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orders-api
  namespace: apps
  labels:
    app: orders-api
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: orders-api
  port:
    targetPort: http
---
# ServiceAccount for JWT authentication
# The SA name MUST match the host annotation: authn-jwt/openshift/serviceaccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api-sa
  namespace: apps
  labels:
    app: orders-api
