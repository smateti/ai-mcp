###############################################################################
# 00-namespace.yaml — OpenShift Project for Conjur OSS
#
# Creates the conjur-system namespace with appropriate labels and annotations
# for OpenShift Container Platform.
###############################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: conjur-system
  labels:
    purpose: secrets-management
    app.kubernetes.io/part-of: conjur
  annotations:
    openshift.io/description: "CyberArk Conjur OSS - Enterprise Secrets Management"
    openshift.io/display-name: "Conjur System"
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    purpose: application-tier
    app.kubernetes.io/part-of: enterprise-apps
  annotations:
    openshift.io/description: "Application workloads consuming Conjur secrets"
    openshift.io/display-name: "Applications"
