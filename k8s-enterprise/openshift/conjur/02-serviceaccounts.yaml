###############################################################################
# 02-serviceaccounts.yaml — ServiceAccounts + SCC bindings for Conjur
#
# Each component gets its own SA, bound to the appropriate SCC.
###############################################################################

# --- PostgreSQL ServiceAccount ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-postgres-sa
  namespace: conjur-system
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: conjur
---
# --- Conjur Server ServiceAccount ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-server-sa
  namespace: conjur-system
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: conjur
---
# --- Conjur REST API ServiceAccount (in apps namespace) ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-rest-sa
  namespace: apps
  labels:
    app.kubernetes.io/component: rest-api
    app.kubernetes.io/part-of: conjur
---
# --- Conjur Web UI ServiceAccount (in apps namespace) ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-web-sa
  namespace: apps
  labels:
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/part-of: conjur
