###############################################################################
# infra-resource-template.yml — Shared infra resources (SMTP, LDAP, OAuth, certs, API)
#
# Load into the appropriate sub-path under resources/:
#   .../resources/api    → API keys for external services
#   .../resources/smtp   → SMTP server credentials
#   .../resources/ldap   → LDAP bind credentials
#   .../resources/oauth  → OAuth client credentials
#   .../resources/certs  → Certificate/keystore passwords
#
# Access model: Product-wide shared (via resources-readers layer)
###############################################################################

# ===== API Keys (load into .../resources/api) =====
# Example: Stripe payment gateway
#   curl -X POST .../policy/acme%2Fprod%2Fproducts%2Fpayments%2Fresources%2Fapi \
#     -d @infra-resource-template.yml

- !policy
  id: stripe
  body:
    - !variable
      id: key
      annotations:
        description: "Stripe API key"
    - !variable
      id: secret
      annotations:
        description: "Stripe API secret"
    - !variable
      id: webhook-secret
      annotations:
        description: "Stripe webhook signing secret"

# --- To add more API services, duplicate the block above:
# - !policy
#   id: twilio
#   body:
#     - !variable key
#     - !variable secret

