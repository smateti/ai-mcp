###############################################################################
# acme.yml — Environment branches under acme/
#
# Load into: acme
#   curl -X POST .../policies/myConjurAccount/policy/acme -d @acme.yml
#
# Creates the three environment branches:
#   acme/dev/   — development
#   acme/qa/    — quality assurance / staging
#   acme/prod/  — production
###############################################################################

- !policy
  id: dev
  annotations:
    description: "Development environment"

- !policy
  id: qa
  annotations:
    description: "QA / staging environment"

- !policy
  id: prod
  annotations:
    description: "Production environment"
