###############################################################################
# jwt-enrollment-template.yml — Enroll hosts in JWT authenticator
#
# Load into: root
#   curl -X POST .../policies/myConjurAccount/policy/root \
#     -d @jwt-enrollment-template.yml
#
# This grants OpenShift app hosts permission to authenticate via
# authn-jwt/openshift. Must be loaded AFTER app-host-template.yml.
#
# API-key-auth hosts (batch, websphere) do NOT need JWT enrollment.
###############################################################################

# --- Payments product: OpenShift hosts → JWT authenticatable ---
- !grant
  role: !group conjur/authn-jwt/openshift/authenticatable
  member: !host acme/prod/products/payments/apps/openshift/orders-api

- !grant
  role: !group conjur/authn-jwt/openshift/authenticatable
  member: !host acme/prod/products/payments/apps/openshift/settlement-api

# --- Add more products/hosts as needed ---
