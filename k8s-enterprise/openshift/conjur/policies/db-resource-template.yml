###############################################################################
# db-resource-template.yml — Register a database with per-app access control
#
# Load into: acme/{env}/products/{product}/resources/dbs
#   curl -X POST .../policies/myConjurAccount/policy/acme%2Fprod%2Fproducts%2Fpayments%2Fresources%2Fdbs \
#     -d @db-resource-template.yml
#
# Replace {DB_NAME} with actual database name (e.g., orders-db, ledger-db).
#
# Access model: Per-app granular
#   - Each DB has a 'readers' group
#   - Only specific app hosts are granted membership
#   - Use delegation-template.yml to grant app → DB access
#
# Variables created:
#   .../dbs/{DB_NAME}/url
#   .../dbs/{DB_NAME}/username
#   .../dbs/{DB_NAME}/password
#   .../dbs/{DB_NAME}/port
#   .../dbs/{DB_NAME}/database-name
#   .../dbs/{DB_NAME}/driver-class
###############################################################################

# --- Example: orders-db ---
- !policy
  id: orders-db
  body:
    - !variable
      id: url
      annotations:
        description: "JDBC connection URL"
        example: "jdbc:db2://db2-server:50000/ORDERSDB"

    - !variable
      id: username
      annotations:
        description: "Database username"

    - !variable
      id: password
      annotations:
        description: "Database password"

    - !variable
      id: port
      annotations:
        description: "Database port"
        example: "50000"

    - !variable
      id: database-name
      annotations:
        description: "Database/schema name"
        example: "ORDERSDB"

    - !variable
      id: driver-class
      annotations:
        description: "JDBC driver class name"
        example: "com.ibm.db2.jcc.DB2Driver"

    # Per-app reader group — only explicitly granted apps can read these secrets
    - !group
      id: readers
      annotations:
        description: "Hosts permitted to read orders-db credentials"

    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable url
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable username
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable password
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable port
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable database-name
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable driver-class

# --- Example: ledger-db ---
- !policy
  id: ledger-db
  body:
    - !variable url
    - !variable username
    - !variable password
    - !variable port
    - !variable database-name
    - !variable driver-class

    - !group readers
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable url
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable username
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable password
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable port
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable database-name
    - !permit
      role: !group readers
      privilege: [ read, execute ]
      resource: !variable driver-class
