###############################################################################
# conjur-authn-jwt-openshift.yml — JWT Authenticator for OpenShift
#
# Load into: conjur/authn-jwt
#   curl -X POST .../policies/myConjurAccount/policy/conjur%2Fauthn-jwt -d @conjur-authn-jwt-openshift.yml
#
# After loading, set the variable values:
#   conjur/authn-jwt/openshift/jwks-uri         → OCP OIDC JWKS endpoint
#   conjur/authn-jwt/openshift/token-app-property → "sub" (maps SA to host)
#   conjur/authn-jwt/openshift/identity-path     → base path for host lookup
#   conjur/authn-jwt/openshift/issuer            → OCP token issuer URL
#
# Then enable the authenticator on Conjur server:
#   CONJUR_AUTHENTICATORS=authn,authn-jwt/openshift
#
# To find your OCP OIDC endpoint:
#   oc get --raw /.well-known/openid-configuration | jq .jwks_uri
#   oc get --raw /.well-known/openid-configuration | jq .issuer
###############################################################################

- !policy
  id: openshift
  body:
    # --- Authenticator configuration variables ---
    - !variable
      id: jwks-uri
      annotations:
        description: "OpenShift OIDC JWKS endpoint for token validation"
        example: "https://api.ocp.example.com:6443/openid/v1/jwks"

    - !variable
      id: token-app-property
      annotations:
        description: "JWT claim used to identify the application (usually 'sub')"
        example: "sub"

    - !variable
      id: identity-path
      annotations:
        description: "Base Conjur policy path prepended to the token-app-property value"
        example: "acme/prod/products"

    - !variable
      id: issuer
      annotations:
        description: "Expected 'iss' claim in the JWT (OCP API server URL)"
        example: "https://kubernetes.default.svc"

    - !variable
      id: audience
      annotations:
        description: "Expected 'aud' claim (optional, defaults to conjur account)"

    # --- Mapping claims to Conjur annotations ---
    # These claims from the JWT can be used in host annotations
    # to restrict which pods can authenticate as which hosts.
    - !variable
      id: claim-mapping
      annotations:
        description: "Comma-separated list of JWT claims to map: namespace,serviceaccount"

    # --- Web service representing this authenticator ---
    - !webservice

    # --- Group of hosts allowed to authenticate via this JWT authenticator ---
    - !group
      id: authenticatable
      annotations:
        description: "Hosts permitted to use authn-jwt/openshift"

    - !permit
      role: !group authenticatable
      privilege: [ read, authenticate ]
      resource: !webservice
