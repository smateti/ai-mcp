###############################################################################
# kafka-resource-template.yml — Register a Kafka cluster (product-wide shared)
#
# Load into: acme/{env}/products/{product}/resources/kafka
#   curl -X POST .../policies/myConjurAccount/policy/acme%2Fprod%2Fproducts%2Fpayments%2Fresources%2Fkafka \
#     -d @kafka-resource-template.yml
#
# Access model: Product-wide shared
#   - All apps in the product's resources-readers layer can read these
#   - Use delegation-template.yml to grant resources-readers → permit
#
# Variables created:
#   .../kafka/{cluster}/bootstrap-servers
#   .../kafka/{cluster}/sasl-username
#   .../kafka/{cluster}/sasl-password
#   .../kafka/{cluster}/sasl-mechanism
#   .../kafka/{cluster}/security-protocol
#   .../kafka/{cluster}/keystore-password
#   .../kafka/{cluster}/truststore-password
#   .../kafka/{cluster}/schema-registry-url
#   .../kafka/{cluster}/schema-registry-key
#   .../kafka/{cluster}/schema-registry-secret
###############################################################################

# --- Example: "main" Kafka cluster ---
- !policy
  id: main
  body:
    - !variable
      id: bootstrap-servers
      annotations:
        description: "Kafka broker list"
        example: "kafka-0.kafka.svc:9093,kafka-1.kafka.svc:9093"

    - !variable
      id: sasl-username
      annotations:
        description: "SASL/SCRAM or SASL/PLAIN username"

    - !variable
      id: sasl-password
      annotations:
        description: "SASL/SCRAM or SASL/PLAIN password"

    - !variable
      id: sasl-mechanism
      annotations:
        description: "SASL mechanism (SCRAM-SHA-512, PLAIN, etc.)"
        example: "SCRAM-SHA-512"

    - !variable
      id: security-protocol
      annotations:
        description: "Kafka security protocol"
        example: "SASL_SSL"

    - !variable
      id: keystore-password
      annotations:
        description: "Client SSL keystore password"

    - !variable
      id: truststore-password
      annotations:
        description: "Client SSL truststore password"

    - !variable
      id: schema-registry-url
      annotations:
        description: "Confluent Schema Registry URL"
        example: "https://schema-registry.kafka.svc:8081"

    - !variable
      id: schema-registry-key
      annotations:
        description: "Schema Registry API key"

    - !variable
      id: schema-registry-secret
      annotations:
        description: "Schema Registry API secret"
