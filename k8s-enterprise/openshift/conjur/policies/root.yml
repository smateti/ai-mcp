###############################################################################
# root.yml — Top-level Conjur policy
#
# Load with:
#   conjurctl policy load root root.yml           (inside Conjur pod)
#   curl -X POST .../policies/myConjurAccount/policy/root -d @root.yml
#
# Creates two top-level branches:
#   conjur/  — authenticator configuration (JWT, etc.)
#   acme/    — enterprise secrets hierarchy
###############################################################################

- !policy
  id: conjur

- !policy
  id: acme
