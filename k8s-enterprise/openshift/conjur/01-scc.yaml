###############################################################################
# 01-scc.yaml — SCC bindings for Conjur on OpenShift
#
# Both Conjur server and PostgreSQL need the anyuid SCC:
# - Conjur server: runs internal processes as root
# - PostgreSQL (postgres:15): runs as UID 999
#
# IMPORTANT: Apply AFTER 00-namespace.yaml and 02-serviceaccounts.yaml
# Requires cluster-admin privileges.
#
# Equivalent imperative commands:
#   oc adm policy add-scc-to-user anyuid -z conjur-server-sa -n conjur-system
#   oc adm policy add-scc-to-user anyuid -z conjur-postgres-sa -n conjur-system
###############################################################################

# --- Grant anyuid SCC to Conjur Server SA ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: conjur-server-anyuid
  labels:
    app.kubernetes.io/part-of: conjur
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: conjur-server-sa
  namespace: conjur-system
---
# --- Grant anyuid SCC to PostgreSQL SA ---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: conjur-postgres-anyuid
  labels:
    app.kubernetes.io/part-of: conjur
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: conjur-postgres-sa
  namespace: conjur-system
