###############################################################################
# 06-conjur-admin-apps.yaml — Conjur REST API + Web UI on OpenShift
#
# Deploys:
# - conjur-microprofile-rest:  Headless REST API for managing Conjur
#     (policies, secrets, app onboarding, K8s Secret creation)
# - conjur-microprofile-web:   DBA-friendly Web UI
#
# Both run on Open Liberty (MicroProfile 6.1) and are OpenShift-compatible
# out of the box — Liberty runs as non-root UID 1001 by default.
#
# Prerequisites:
# - Images pushed to your OpenShift internal registry or external registry
# - conjur-app-identity Secret created in apps namespace
###############################################################################

# --- Conjur App Identity Secret (shared by admin apps) ---
# This is a placeholder — replace values after running the account setup.
apiVersion: v1
kind: Secret
metadata:
  name: conjur-app-identity
  namespace: apps
  labels:
    app.kubernetes.io/part-of: conjur
type: Opaque
stringData:
  CONJUR_APPLIANCE_URL: "http://conjur-server.conjur-system.svc.cluster.local"
  CONJUR_ACCOUNT: "myConjurAccount"
  CONJUR_AUTHN_LOGIN: "host/apps/liberty-app"
  CONJUR_AUTHN_API_KEY: "REPLACE_WITH_ACTUAL_API_KEY"
  CONJUR_ADMIN_API_KEY: "REPLACE_WITH_ACTUAL_ADMIN_API_KEY"
---
# ============================================================================
#  CONJUR REST API
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-rest
  namespace: apps
  labels:
    app: conjur-rest
    app.kubernetes.io/name: conjur-rest
    app.kubernetes.io/component: rest-api
    app.kubernetes.io/part-of: conjur
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjur-rest
  template:
    metadata:
      labels:
        app: conjur-rest
        app.kubernetes.io/name: conjur-rest
        app.kubernetes.io/component: rest-api
        app.kubernetes.io/part-of: conjur
    spec:
      serviceAccountName: conjur-rest-sa
      # Open Liberty runs as UID 1001 by default — no SCC override needed
      containers:
      - name: conjur-rest
        # Update to your registry path:
        # image: image-registry.openshift-image-registry.svc:5000/apps/conjur-microprofile-rest:latest
        # Or external: image: quay.io/yourorg/conjur-microprofile-rest:latest
        image: image-registry.openshift-image-registry.svc:5000/apps/conjur-microprofile-rest:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 9080
          protocol: TCP
        env:
        - name: CONJUR_APPLIANCE_URL
          valueFrom:
            secretKeyRef:
              name: conjur-app-identity
              key: CONJUR_APPLIANCE_URL
        - name: CONJUR_ACCOUNT
          valueFrom:
            secretKeyRef:
              name: conjur-app-identity
              key: CONJUR_ACCOUNT
        - name: CONJUR_ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: conjur-app-identity
              key: CONJUR_ADMIN_API_KEY
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
# --- Conjur REST API Service ---
apiVersion: v1
kind: Service
metadata:
  name: conjur-rest
  namespace: apps
  labels:
    app: conjur-rest
    app.kubernetes.io/component: rest-api
    app.kubernetes.io/part-of: conjur
spec:
  type: ClusterIP
  selector:
    app: conjur-rest
  ports:
  - name: http
    port: 9080
    targetPort: 9080
    protocol: TCP
---
# ============================================================================
#  CONJUR WEB UI
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-web
  namespace: apps
  labels:
    app: conjur-web
    app.kubernetes.io/name: conjur-web
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/part-of: conjur
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjur-web
  template:
    metadata:
      labels:
        app: conjur-web
        app.kubernetes.io/name: conjur-web
        app.kubernetes.io/component: web-ui
        app.kubernetes.io/part-of: conjur
    spec:
      serviceAccountName: conjur-web-sa
      containers:
      - name: conjur-web
        # Update to your registry path:
        image: image-registry.openshift-image-registry.svc:5000/apps/conjur-microprofile-web:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 9080
          protocol: TCP
        env:
        - name: CONJUR_API_MP_REST_URL
          value: "http://conjur-rest.apps.svc.cluster.local:9080"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
# --- Conjur Web UI Service ---
apiVersion: v1
kind: Service
metadata:
  name: conjur-web
  namespace: apps
  labels:
    app: conjur-web
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/part-of: conjur
spec:
  type: ClusterIP
  selector:
    app: conjur-web
  ports:
  - name: http
    port: 9080
    targetPort: 9080
    protocol: TCP
