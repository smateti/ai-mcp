###############################################################################
# 04-postgres.yaml — PostgreSQL for Conjur backend on OpenShift
#
# Uses the Red Hat postgresql-15 image which is designed for OpenShift:
# - Runs as arbitrary UID assigned by OpenShift (no custom SCC needed)
# - Works with the default restricted/restricted-v2 SCC
# - Uses POSTGRESQL_* env vars (not POSTGRES_*)
#
# Data directory uses PVC for durability across pod restarts.
###############################################################################

# --- Secret for PostgreSQL credentials ---
apiVersion: v1
kind: Secret
metadata:
  name: conjur-postgres-secret
  namespace: conjur-system
  labels:
    app: conjur-postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: conjur
type: Opaque
stringData:
  POSTGRESQL_USER: "conjur"
  POSTGRESQL_PASSWORD: "SuperSecretPg"
  POSTGRESQL_DATABASE: "conjur"
  POSTGRESQL_ADMIN_PASSWORD: "SuperSecretPg"
  # The Conjur DATABASE_URL must match these credentials:
  #   postgres://conjur:SuperSecretPg@conjur-postgres.conjur-system.svc.cluster.local:5432/conjur
---
# --- PersistentVolumeClaim for PostgreSQL data ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conjur-postgres-data
  namespace: conjur-system
  labels:
    app: conjur-postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: conjur
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Uncomment and set to your StorageClass if not using default:
  # storageClassName: gp3-csi
---
# --- PostgreSQL Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-postgres
  namespace: conjur-system
  labels:
    app: conjur-postgres
    app.kubernetes.io/name: conjur-postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: conjur
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: conjur-postgres
  template:
    metadata:
      labels:
        app: conjur-postgres
        app.kubernetes.io/name: conjur-postgres
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: conjur
    spec:
      serviceAccountName: conjur-postgres-sa
      # NO securityContext override — OpenShift assigns a UID from the
      # namespace range (e.g., 1002450000). The Red Hat postgresql image
      # is built to run as any arbitrary UID.
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-15:latest
        ports:
        - containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: conjur-postgres-secret
              key: POSTGRESQL_USER
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: conjur-postgres-secret
              key: POSTGRESQL_PASSWORD
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: conjur-postgres-secret
              key: POSTGRESQL_DATABASE
        - name: POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: conjur-postgres-secret
              key: POSTGRESQL_ADMIN_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/pgsql/data
        readinessProbe:
          exec:
            command:
            - /usr/libexec/check-container
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - /usr/libexec/check-container
            - --live
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: conjur-postgres-data
---
# --- PostgreSQL Service (ClusterIP — internal only) ---
apiVersion: v1
kind: Service
metadata:
  name: conjur-postgres
  namespace: conjur-system
  labels:
    app: conjur-postgres
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: conjur
spec:
  type: ClusterIP
  selector:
    app: conjur-postgres
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
    protocol: TCP
