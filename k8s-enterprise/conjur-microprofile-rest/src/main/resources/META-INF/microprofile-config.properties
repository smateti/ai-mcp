# Conjur connection (overridden by K8s Secret env vars at runtime)
conjur.appliance.url=http://conjur-server.conjur-system.svc.cluster.local
conjur.account=nimbusConjurAccount
conjur.authn.login=admin
conjur.admin.api.key=not-set

# Token cache TTL in seconds (Conjur tokens expire after ~8 minutes)
conjur.token.ttl.seconds=360

# Known secret variable IDs (comma-separated)
conjur.known.secrets=db/empdb-uid,db/empdb-pwd

# Known database names (convention: db/{name}-uid, db/{name}-pwd)
conjur.known.databases=empdb

# Known application hosts
conjur.known.apps=liberty-app

# H2 reference data database path (file-based)
refdata.db.path=/data/refdata
