# Conjur connection settings (override via K8s Secret env vars)
conjur.appliance.url=http://conjur-server.conjur-system.svc.cluster.local
conjur.account=nimbusConjurAccount
conjur.authn.login=host/apps/liberty-app
conjur.authn.api.key=not-set

# Application defaults (will be overridden by Conjur secrets)
conjur.secret.db.username=default-user
conjur.secret.db.password=default-pass
