###############################################################################
# orders-api-deployment.yaml — Example K8s Deployment for orders-api
#
# For local Docker Desktop Kubernetes with Conjur account: nimbusConjurAccount
# Demonstrates both JWT auth and API key auth configurations.
###############################################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: apps
  labels:
    app: orders-api
    product: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
        product: payments
    spec:
      serviceAccountName: orders-api-sa
      containers:
      - name: orders-api
        image: localhost:30500/orders-api:latest
        ports:
        - name: http
          containerPort: 9080
        - name: https
          containerPort: 9443
        env:
        # ===== Conjur connection =====
        - name: CONJUR_APPLIANCE_URL
          value: "http://conjur-server.conjur-system.svc.cluster.local"
        - name: CONJUR_ACCOUNT
          value: "nimbusConjurAccount"

        # ===== Option A: JWT Auth (recommended for K8s) =====
        - name: CONJUR_AUTHN_JWT_SERVICE_ID
          value: "kubernetes"
        - name: CONJUR_JWT_TOKEN_PATH
          value: "/var/run/secrets/kubernetes.io/serviceaccount/token"

        # ===== Option B: API Key Auth (uncomment, remove JWT vars) =====
        # - name: CONJUR_AUTHN_LOGIN
        #   valueFrom:
        #     secretKeyRef:
        #       name: conjur-orders-api
        #       key: CONJUR_AUTHN_LOGIN
        # - name: CONJUR_AUTHN_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: conjur-orders-api
        #       key: CONJUR_AUTHN_API_KEY

        # ===== Secret mappings =====
        - name: CONJUR_SECRETS
          value: >-
            db.url=nimbus/prod/products/payments/resources/dbs/orders-db/url,
            db.username=nimbus/prod/products/payments/resources/dbs/orders-db/username,
            db.password=nimbus/prod/products/payments/resources/dbs/orders-db/password,
            db.port=nimbus/prod/products/payments/resources/dbs/orders-db/port,
            db.databaseName=nimbus/prod/products/payments/resources/dbs/orders-db/database-name,
            db.driverClass=nimbus/prod/products/payments/resources/dbs/orders-db/driver-class,
            kafka.bootstrap.servers=nimbus/prod/products/payments/resources/kafka/main/bootstrap-servers,
            kafka.sasl.username=nimbus/prod/products/payments/resources/kafka/main/sasl-username,
            kafka.sasl.password=nimbus/prod/products/payments/resources/kafka/main/sasl-password,
            kafka.sasl.mechanism=nimbus/prod/products/payments/resources/kafka/main/sasl-mechanism,
            kafka.security.protocol=nimbus/prod/products/payments/resources/kafka/main/security-protocol,
            kafka.ssl.keystore.password=nimbus/prod/products/payments/resources/kafka/main/keystore-password,
            kafka.ssl.truststore.password=nimbus/prod/products/payments/resources/kafka/main/truststore-password,
            stripe.api.key=nimbus/prod/products/payments/resources/api/stripe/key,
            stripe.api.secret=nimbus/prod/products/payments/resources/api/stripe/secret

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: apps
spec:
  type: NodePort
  selector:
    app: orders-api
  ports:
  - name: http
    port: 9080
    targetPort: 9080
    nodePort: 30091
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api-sa
  namespace: apps
  labels:
    app: orders-api
