###############################################################################
# root.yml — Top-level Conjur policy (Nimbus)
#
# Load with:
#   conjurctl policy load root root.yml           (inside Conjur pod)
#   curl -X POST .../policies/nimbusConjurAccount/policy/root -d @root.yml
#
# Creates two top-level branches:
#   conjur/  — authenticator configuration (JWT, etc.)
#   nimbus/  — enterprise secrets hierarchy
###############################################################################

- !policy
  id: conjur

- !policy
  id: nimbus
