###############################################################################
# jwt-enrollment-template.yml — Enroll hosts in JWT authenticator
#
# Load into: root
#   curl -X POST .../policies/nimbusConjurAccount/policy/root \
#     -d @jwt-enrollment-template.yml
#
# Grants Kubernetes app hosts permission to authenticate via
# authn-jwt/kubernetes. Must be loaded AFTER app-host-template.yml.
###############################################################################

- !grant
  role: !group conjur/authn-jwt/kubernetes/authenticatable
  member: !host nimbus/prod/products/payments/apps/openshift/orders-api

- !grant
  role: !group conjur/authn-jwt/kubernetes/authenticatable
  member: !host nimbus/prod/products/payments/apps/openshift/settlement-api

# --- Add more products/hosts as needed ---
