###############################################################################
# app-host-template.yml — Register application hosts
#
# Load into: nimbus/{env}/products/{product}/apps/{type}
#   Kubernetes:  .../apps/openshift
#   Batch:       .../apps/batch
#   WebSphere:   .../apps/websphere
#
# Example (Kubernetes microservice):
#   curl -X POST .../policy/nimbus%2Fprod%2Fproducts%2Fpayments%2Fapps%2Fopenshift \
#     -d @app-host-template.yml
#
# Authentication:
#   openshift → JWT auth (annotations match SA token claims)
#   batch     → API key auth (receives API key on host creation)
#   websphere → API key auth (receives API key on host creation)
###############################################################################

# ===== Kubernetes microservices (JWT auth) =====
# Annotations map to JWT claims for authn-jwt/kubernetes validation.

- !host
  id: orders-api
  annotations:
    description: "Orders API microservice"
    authn-jwt/kubernetes/namespace: "apps"
    authn-jwt/kubernetes/serviceaccount: "orders-api-sa"
    product: "payments"
    team: "payments-team"
    type: "openshift"

- !host
  id: settlement-api
  annotations:
    description: "Settlement API microservice"
    authn-jwt/kubernetes/namespace: "apps"
    authn-jwt/kubernetes/serviceaccount: "settlement-api-sa"
    product: "payments"
    team: "payments-team"
    type: "openshift"

