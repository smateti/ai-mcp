apiVersion: apps/v1
kind: Deployment
metadata:
  name: db2
  namespace: databases
  labels:
    app: db2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db2
  template:
    metadata:
      labels:
        app: db2
    spec:
      containers:
      - name: db2
        image: icr.io/db2_community/db2:11.5.8.0
        securityContext:
          privileged: true
        ports:
        - containerPort: 50000
        env:
        - name: LICENSE
          value: "accept"
        - name: DB2INST1_PASSWORD
          value: "appSecretPass123"
        - name: DBNAME
          value: "empdb"
        - name: DB2INSTANCE
          value: "db2inst1"
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: db2
  namespace: databases
spec:
  selector:
    app: db2
  ports:
  - port: 50000
    targetPort: 50000
