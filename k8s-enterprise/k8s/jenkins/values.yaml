controller:
  image:
    tag: "lts-jdk17"
  serviceType: NodePort
  nodePort: 30880
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  installPlugins:
    - kubernetes:4423.vb_59f230b_ce53
    - workflow-aggregator:596.v8c21c963d92d
    - git:5.2.2
    - configuration-as-code:2053.vb_0da_47381a_25
    - pipeline-stage-view:2.34
  JCasC:
    configScripts:
      k8s-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default.svc.cluster.local"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                jenkinsTunnel: "jenkins-agent:50000"
                templates:
                  - name: "maven-agent"
                    label: "maven"
                    namespace: "jenkins"
                    containers:
                      - name: "maven"
                        image: "maven:3.9-eclipse-temurin-17"
                        command: "sleep"
                        args: "infinity"
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "512Mi"
                      - name: "docker"
                        image: "docker:24-cli"
                        command: "sleep"
                        args: "infinity"
                        ttyEnabled: true
                    volumes:
                      - hostPathVolume:
                          hostPath: "/var/run/docker.sock"
                          mountPath: "/var/run/docker.sock"
                    serviceAccount: "jenkins"

persistence:
  enabled: true
  size: "5Gi"

serviceAccount:
  create: false
  name: "jenkins"
