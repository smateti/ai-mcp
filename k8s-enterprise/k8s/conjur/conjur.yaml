apiVersion: v1
kind: Secret
metadata:
  name: conjur-config
  namespace: conjur-system
type: Opaque
stringData:
  CONJUR_DATA_KEY: "6JXGcCVLYF8EjGvearzb3oabeYB2InGXIkPm5SF25ts="
  DATABASE_URL: "postgres://postgres:SuperSecretPg@conjur-postgres.conjur-system.svc.cluster.local:5432/postgres"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-server
  namespace: conjur-system
  labels:
    app: conjur-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjur-server
  template:
    metadata:
      labels:
        app: conjur-server
    spec:
      containers:
      - name: conjur
        image: cyberark/conjur:latest
        command: ["conjurctl", "server"]
        ports:
        - containerPort: 80
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: conjur-config
              key: DATABASE_URL
        - name: CONJUR_DATA_KEY
          valueFrom:
            secretKeyRef:
              name: conjur-config
              key: CONJUR_DATA_KEY
        - name: CONJUR_AUTHENTICATORS
          value: "authn"
        - name: CONJUR_TELEMETRY_ENABLED
          value: "false"
        - name: RAILS_ENV
          value: "production"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: conjur-server
  namespace: conjur-system
spec:
  type: NodePort
  selector:
    app: conjur-server
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
