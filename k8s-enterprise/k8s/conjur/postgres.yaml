apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: conjur-system
type: Opaque
stringData:
  POSTGRES_PASSWORD: "SuperSecretPg"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-postgres
  namespace: conjur-system
  labels:
    app: conjur-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjur-postgres
  template:
    metadata:
      labels:
        app: conjur-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "password"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: conjur-postgres
  namespace: conjur-system
spec:
  selector:
    app: conjur-postgres
  ports:
  - port: 5432
    targetPort: 5432
