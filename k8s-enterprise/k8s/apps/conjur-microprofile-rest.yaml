apiVersion: v1
kind: ServiceAccount
metadata:
  name: conjur-rest-sa
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conjur-secret-manager
  namespace: apps
rules:
- apiGroups: [""]
  resources: ["secrets", "services", "serviceaccounts", "pods", "pods/log"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conjur-rest-secret-manager
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: conjur-secret-manager
subjects:
- kind: ServiceAccount
  name: conjur-rest-sa
  namespace: apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conjur-rest-data
  namespace: apps
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-rest
  namespace: apps
  labels:
    app: conjur-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjur-rest
  template:
    metadata:
      labels:
        app: conjur-rest
    spec:
      serviceAccountName: conjur-rest-sa
      volumes:
      - name: refdata
        persistentVolumeClaim:
          claimName: conjur-rest-data
      containers:
      - name: conjur-rest
        image: localhost:30500/conjur-microprofile-rest:latest
        ports:
        - containerPort: 9080
        env:
        - name: CONJUR_APPLIANCE_URL
          valueFrom:
            secretKeyRef:
              name: conjur-app-identity
              key: CONJUR_APPLIANCE_URL
        - name: CONJUR_ACCOUNT
          valueFrom:
            secretKeyRef:
              name: conjur-app-identity
              key: CONJUR_ACCOUNT
        - name: CONJUR_ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: conjur-app-identity
              key: CONJUR_ADMIN_API_KEY
        volumeMounts:
        - name: refdata
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 45
          periodSeconds: 15
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "768Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: conjur-rest
  namespace: apps
spec:
  type: NodePort
  selector:
    app: conjur-rest
  ports:
  - port: 9080
    targetPort: 9080
    nodePort: 30086
