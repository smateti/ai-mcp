apiVersion: apps/v1
kind: Deployment
metadata:
  name: conjur-web
  namespace: apps
  labels:
    app: conjur-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conjur-web
  template:
    metadata:
      labels:
        app: conjur-web
    spec:
      containers:
      - name: conjur-web
        image: localhost:30500/conjur-microprofile-web:latest
        ports:
        - containerPort: 9080
        env:
        - name: CONJUR_API_MP_REST_URL
          value: "http://conjur-rest.apps.svc.cluster.local:9080"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 45
          periodSeconds: 15
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: conjur-web
  namespace: apps
spec:
  type: NodePort
  selector:
    app: conjur-web
  ports:
  - port: 9080
    targetPort: 9080
    nodePort: 30087
