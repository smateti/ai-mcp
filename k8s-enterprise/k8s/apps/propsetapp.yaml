apiVersion: v1
kind: ServiceAccount
metadata:
  name: propsetapp-sa
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-publisher
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: propsetapp-configmap-binding
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-publisher
subjects:
  - kind: ServiceAccount
    name: propsetapp-sa
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: propsetapp
  namespace: apps
  labels:
    app: propsetapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: propsetapp
  template:
    metadata:
      labels:
        app: propsetapp
    spec:
      serviceAccountName: propsetapp-sa
      containers:
      - name: propsetapp
        image: localhost:30500/propsetapp:latest
        ports:
        - containerPort: 9080
        env:
        - name: PROPSET_CONFIG_PATH
          value: "/config/datasources.yaml"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 45
          periodSeconds: 15
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: propsetapp
  namespace: apps
spec:
  type: NodePort
  selector:
    app: propsetapp
  ports:
  - port: 9080
    targetPort: 9080
    nodePort: 30085
