apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app
  namespace: apps
  labels:
    app: employee-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-app
  template:
    metadata:
      labels:
        app: employee-app
    spec:
      containers:
      - name: employee-app
        image: localhost:30500/employee-app:latest
        ports:
        - containerPort: 9080
        env:
        # From ConfigMap (published by PropSetApp)
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: empdb-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: empdb-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: empdb-config
              key: db.name
        # Legacy compat: ConfigMap still provides these for reference
        - name: DB_CONJUR_UID_KEY
          valueFrom:
            configMapKeyRef:
              name: empdb-config
              key: db.conjur.uid.key
        - name: DB_CONJUR_PWD_KEY
          valueFrom:
            configMapKeyRef:
              name: empdb-config
              key: db.conjur.pwd.key
        # Per-app Conjur identity (from K8s Secret conjur-employee-app)
        # Falls back to conjur-app-identity if per-app secret doesn't exist yet
        - name: CONJUR_APPLIANCE_URL
          valueFrom:
            secretKeyRef:
              name: conjur-employee-app
              key: CONJUR_APPLIANCE_URL
              optional: true
        - name: CONJUR_ACCOUNT
          valueFrom:
            secretKeyRef:
              name: conjur-employee-app
              key: CONJUR_ACCOUNT
              optional: true
        - name: CONJUR_AUTHN_LOGIN
          valueFrom:
            secretKeyRef:
              name: conjur-employee-app
              key: CONJUR_AUTHN_LOGIN
              optional: true
        - name: CONJUR_AUTHN_API_KEY
          valueFrom:
            secretKeyRef:
              name: conjur-employee-app
              key: CONJUR_AUTHN_API_KEY
              optional: true
        # Conjur secret mappings (used by conjur-microprofile-lib)
        - name: CONJUR_SECRETS
          value: "db.username=db/empdb-uid,db.password=db/empdb-pwd"
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9080
          initialDelaySeconds: 60
          periodSeconds: 15
        resources:
          requests:
            memory: "512Mi"
            cpu: "300m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: employee-app
  namespace: apps
spec:
  type: NodePort
  selector:
    app: employee-app
  ports:
  - port: 9080
    targetPort: 9080
    nodePort: 30090
