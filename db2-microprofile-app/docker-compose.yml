version: '3.8'

services:
  # PostgreSQL backend for Conjur (Conjur itself always needs PostgreSQL)
  database:
    image: postgres:15
    container_name: conjur-postgres-db2
    environment:
      POSTGRES_HOST_AUTH_METHOD: password
      POSTGRES_PASSWORD: SuperSecretPg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # CyberArk Conjur OSS server
  conjur:
    image: cyberark/conjur:latest
    container_name: conjur-server-db2
    command: server
    environment:
      DATABASE_URL: postgres://postgres:SuperSecretPg@database/postgres
      CONJUR_DATA_KEY: "${CONJUR_DATA_KEY}"
      CONJUR_AUTHENTICATORS: authn
      CONJUR_TELEMETRY_ENABLED: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialize Conjur: load policies, set secrets via REST API
  conjur-init:
    image: curlimages/curl:latest
    container_name: conjur-init-db2
    depends_on:
      conjur:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        CONJUR_URL="http://conjur"
        ACCOUNT="myConjurAccount"
        API_KEY="$${CONJUR_ADMIN_API_KEY}"

        echo "==> Authenticating with Conjur..."
        TOKEN=$$(curl -s --data "$$API_KEY" \
          "$$CONJUR_URL/authn/$$ACCOUNT/admin/authenticate" | base64 | tr -d '\n')
        AUTH="Authorization: Token token=\"$$TOKEN\""

        echo "==> Loading root policy..."
        curl -s -X PUT -H "$$AUTH" -H "Content-Type: application/x-yaml" \
          -d "$$(cat /policy/root.yml)" \
          "$$CONJUR_URL/policies/$$ACCOUNT/policy/root"

        echo ""
        echo "==> Re-authenticating..."
        TOKEN=$$(curl -s --data "$$API_KEY" \
          "$$CONJUR_URL/authn/$$ACCOUNT/admin/authenticate" | base64 | tr -d '\n')
        AUTH="Authorization: Token token=\"$$TOKEN\""

        echo "==> Loading myapp policy (creates layer + host)..."
        MYAPP_RESULT=$$(curl -s -X POST -H "$$AUTH" -H "Content-Type: application/x-yaml" \
          -d "$$(cat /policy/myapp.yml)" \
          "$$CONJUR_URL/policies/$$ACCOUNT/policy/myapp")
        echo "$$MYAPP_RESULT"

        echo ""
        echo "==> Loading db policy (references myapp layer)..."
        curl -s -X POST -H "$$AUTH" -H "Content-Type: application/x-yaml" \
          -d "$$(cat /policy/db.yml)" \
          "$$CONJUR_URL/policies/$$ACCOUNT/policy/db"

        echo ""
        echo "==> Re-authenticating..."
        TOKEN=$$(curl -s --data "$$API_KEY" \
          "$$CONJUR_URL/authn/$$ACCOUNT/admin/authenticate" | base64 | tr -d '\n')
        AUTH="Authorization: Token token=\"$$TOKEN\""

        echo "==> Setting secret values..."
        curl -s -X POST -H "$$AUTH" -d "db2inst1" \
          "$$CONJUR_URL/secrets/$$ACCOUNT/variable/db%2Fusername"
        curl -s -X POST -H "$$AUTH" -d "appSecretPass123" \
          "$$CONJUR_URL/secrets/$$ACCOUNT/variable/db%2Fpassword"
        curl -s -X POST -H "$$AUTH" -d "jdbc:db2://appdb:50000/empdb" \
          "$$CONJUR_URL/secrets/$$ACCOUNT/variable/db%2Furl"
        curl -s -X POST -H "$$AUTH" -d "conjur-api-key-12345" \
          "$$CONJUR_URL/secrets/$$ACCOUNT/variable/myapp%2Fapi-key"
        curl -s -X POST -H "$$AUTH" -d "db2-microprofile-app" \
          "$$CONJUR_URL/secrets/$$ACCOUNT/variable/myapp%2Fapp-name"

        echo ""
        echo "==> Conjur initialization complete!"
    environment:
      CONJUR_ADMIN_API_KEY: "${CONJUR_ADMIN_API_KEY}"
    volumes:
      - ./conjur/policy:/policy:ro

  # IBM DB2 application database
  appdb:
    image: icr.io/db2_community/db2:11.5.8.0
    container_name: app-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: appSecretPass123
      DBNAME: empdb
      DB2INSTANCE: db2inst1
    ports:
      - "50000:50000"
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 CONNECT TO empdb"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s
    volumes:
      - ./sql/init.sql:/var/custom/init.sql:ro

  # Open Liberty MicroProfile application
  app:
    build: .
    container_name: liberty-db2-app
    ports:
      - "9080:9080"
      - "9443:9443"
    environment:
      CONJUR_APPLIANCE_URL: http://conjur:80
      CONJUR_ACCOUNT: myConjurAccount
      CONJUR_AUTHN_LOGIN: host/myapp/liberty-app
      CONJUR_AUTHN_API_KEY: "${APP_HOST_API_KEY}"
      DB_HOST: appdb
      DB_PORT: "50000"
      DB_NAME: empdb
      DB_USERNAME: db2inst1
      DB_PASSWORD: appSecretPass123
    depends_on:
      conjur:
        condition: service_healthy
      appdb:
        condition: service_healthy
