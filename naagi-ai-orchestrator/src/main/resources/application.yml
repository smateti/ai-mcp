server:
  port: 8086

spring:
  application:
    name: naagi-ai-orchestrator
  datasource:
    url: jdbc:h2:file:./data/naagi-orchestrator
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# NAAG Service Dependencies
naagi:
  services:
    rag-service:
      url: http://localhost:8080
    tool-registry:
      url: http://localhost:8081
    mcp-gateway:
      url: http://localhost:8082
    category-admin:
      url: http://localhost:8085

  # LLM Configuration (llama.cpp multi-model server, single port)
  llm:
    provider: llamacpp
    baseUrl: http://localhost:8000
    model: llama3.1-8b-instruct
    timeout: 60000

  # Tool selection thresholds
  tool-selection:
    mode: auto  # native, prompt, or auto (try native first, fall back to prompt)
    confidence:
      high-threshold: 0.8
      low-threshold: 0.5
    max-alternatives: 3
    parameter-timeout-minutes: 5

  # Agent (ReAct loop) configuration
  agent:
    enabled: true
    max-steps: 10
    timeout-seconds: 120
    parallel-tool-calls: true
    system-prompt: classpath:agent-system-prompt.txt
    planning:
      enabled: true
    reflection:
      enabled: true

  # Input/output guardrails
  guardrails:
    enabled: true
    max-input-length: 16000
    max-output-length: 16000
    pii-detection:
      enabled: true
    injection-detection:
      enabled: true

# Logging
logging:
  level:
    com.naagii.orchestrator: DEBUG

# Actuator/Prometheus Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: naagi-ai-orchestrator
    export:
      prometheus:
        enabled: true
