<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBOL Analyzer</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1><span>&#9670;</span> COBOL Analyzer</h1>
      </div>

      <!-- Project Selector -->
      <div class="project-selector">
        <select id="project-select" onchange="onProjectChange()">
          <option value="">-- Select Project --</option>
        </select>
        <button class="icon-btn" onclick="showProjectManager()" title="Manage Projects">&#9881;</button>
      </div>

      <!-- Run Selector -->
      <div class="run-selector" id="run-selector" style="display:none">
        <div class="run-selector-header">
          <span class="run-selector-label">Runs</span>
          <button class="btn-sm btn-accent" onclick="startNewRun()">+ New Run</button>
        </div>
        <div id="run-list" class="run-list"></div>
      </div>

      <!-- Navigation (visible when run selected) -->
      <div id="scoped-nav" style="display:none">
        <div class="sidebar-search">
          <input type="text" id="search" placeholder="Search programs...">
        </div>
        <div class="sidebar-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="CICS">CICS</button>
          <button class="filter-btn" data-filter="BATCH">Batch</button>
          <button class="filter-btn" data-filter="SUBROUTINE">Sub</button>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section">Navigation</div>
          <div class="nav-item active" data-view="dashboard">&#9632; Dashboard</div>
          <div class="nav-item" data-view="graph">&#9675; Dependency Graph</div>
          <div class="nav-section" id="program-count">Programs (0)</div>
          <div id="program-list"></div>
        </nav>
      </div>

      <div class="sidebar-footer" id="sidebar-footer">Select a project to begin</div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="main-header">
        <div class="breadcrumb" id="breadcrumb">
          <span>COBOL Analyzer</span>
        </div>
      </header>
      <div class="main-content" id="content">
        <div class="empty-state">
          <div class="icon">&#9670;</div>
          <p>Select a project from the sidebar, or create a new one to get started.</p>
        </div>
      </div>
    </main>

  </div>

  <script src="/js/app.js"></script>
</body>
</html>
