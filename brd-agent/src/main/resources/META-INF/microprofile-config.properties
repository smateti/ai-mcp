# PROVENANCE: configuration keys from spec lines 90-105

# --- Llama.cpp connection (MP Rest Client) ---
llama/mp-rest/url=http://localhost:8000
llama/mp-rest/connectTimeout=5000
llama/mp-rest/readTimeout=300000

# --- Llama model parameters ---
llama.model=llama3.1-8b-instruct
llama.temperature=0.1
llama.top_p=0.9
llama.max_tokens=4096
llama.timeout_seconds=300
llama.json_mode=true
llama.gbnf_grammar_path=

# --- Agent behaviour ---
agent.concurrency=2
agent.max_retries=4
agent.chunk_line_threshold=400

# --- Paths ---
paths.source_root=d:/apps/ws/ws32/FleetManagement
paths.output_root=d:/apps/ws/ws32/brd-agent/brd
paths.schema=d:/apps/ws/ws32/brd-agent/src/main/resources/brd-schema.json
paths.system_prompt=d:/apps/ws/ws32/prompts/brd-llama.md
