# =============================================================================
# Sample Secrets — pre-created in the cluster
# Apply with: kubectl apply -f samples/secrets.yaml -n team-alpha
# =============================================================================

# From: defaults (values.yaml)
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    layer: defaults
type: Opaque
data:
  JWT_SECRET: "bXktand0LXNlY3JldA==                "  # my-jwt-secret
  SESSION_KEY: "c2Vzc2lvbi1rZXktZGV2"                  # session-key-dev

# From: environments/dev
---
apiVersion: v1
kind: Secret
metadata:
  name: dev-secrets
  labels:
    layer: environment
    environment: dev
type: Opaque
data:
  OTEL_AUTH_TOKEN: "ZGV2LW90ZWwtdG9rZW4="              # dev-otel-token

# From: applications/backend
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    layer: application
    app: backend
type: Opaque
data:
  API_KEY: "ZGV2LWJhY2tlbmQtYXBpLWtleQ=="              # dev-backend-api-key
  REDIS_PASSWORD: "ZGV2LXJlZGlzLXBhc3M="               # dev-redis-pass

# From: applications/backend (db-specific)
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  labels:
    layer: application
    app: backend
type: Opaque
data:
  DB_USERNAME: "YmFja2VuZF91c2Vy"                       # backend_user
  DB_PASSWORD: "ZGV2LWRiLXBhc3N3b3Jk"                   # dev-db-password
