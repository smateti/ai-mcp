# =============================================================================
# Sample ConfigMaps — pre-created in the cluster
# Apply with: kubectl apply -f samples/configmaps.yaml -n team-alpha
# =============================================================================

# From: defaults (values.yaml)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    layer: defaults
data:
  LOG_LEVEL: "info"
  APP_PORT: "8080"
  APP_ENV: "default"

# From: environments/dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-config
  labels:
    layer: environment
    environment: dev
data:
  FEATURE_HOT_RELOAD: "true"
  DEBUG: "true"
  OTEL_EXPORTER: "jaeger-dev.monitoring:4317"

# From: products/team-alpha
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-alpha-config
  labels:
    layer: product
    team: alpha
data:
  TEAM: "alpha"
  CONTACT: "alpha-leads@company.com"
  COST_CENTER: "CC-1234"

# From: applications/backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    layer: application
    app: backend
data:
  APP_TYPE: "backend"
  SERVER_PORT: "8080"
  WORKER_THREADS: "4"
  CORS_ORIGINS: "https://frontend-dev.internal"

# From: applications/backend (db-specific)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  labels:
    layer: application
    app: backend
data:
  DB_HOST: "postgres-dev.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "appdb_dev"
  DB_POOL_SIZE: "10"
  DB_SSL_MODE: "disable"
