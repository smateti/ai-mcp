# =============================================================================
# Base defaults (Layer 1) — always applied
# =============================================================================
# Override hierarchy (Helm -f stacking, last wins):
#   values.yaml  →  environments/<env>  →  products/<product>  →  applications/<app>
#
# Usage:
#   ./deploy.sh dev team-alpha backend
# =============================================================================

replicaCount: 1

image:
  repository: nginx
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8080

# =============================================================================
# Resources — t-shirt sizes or custom
# =============================================================================
# Pick a size OR set custom resources directly.
# If `resources` is set, it takes precedence over `resourceSize`.
# =============================================================================

resourceSizes:
  small:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  medium:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  large:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  xlarge:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

resourceSize: medium

# Custom resources — overrides resourceSize when set
resources: {}
#   requests:
#     cpu: 750m
#     memory: 768Mi
#   limits:
#     cpu: 1500m
#     memory: 1536Mi

nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# Service account — reference a pre-existing service account in the cluster
# =============================================================================
# Set name to use a specific ServiceAccount. Leave empty to use the default.
# =============================================================================

serviceAccountName: ""

# =============================================================================
# Image pull secrets — reference pre-existing secrets for private registries
# =============================================================================
# List of secret names. Each must already exist in the cluster.
# =============================================================================

imagePullSecrets: []
#   - name: my-registry-secret
#   - name: another-registry-secret

# =============================================================================
# Deployment strategy — controls how pods are replaced during updates
# =============================================================================
# Set type to "RollingUpdate" or "Recreate".
# rollingUpdate settings only apply when type is "RollingUpdate".
# =============================================================================

strategy: {}
#   type: RollingUpdate
#   rollingUpdate:
#     maxSurge: 1
#     maxUnavailable: 0

# =============================================================================
# Labels — maps so higher layers accumulate via Helm -f deep merge
# =============================================================================
# Extra labels added ON TOP of the built-in helm/selector labels.
# matchLabels (selector) stays fixed: app.kubernetes.io/name + instance.
# =============================================================================

deploymentLabels: {}
#   app.kubernetes.io/component: "backend"
#   app.kubernetes.io/part-of: "my-platform"
#   team: "alpha"

podLabels: {}
#   app.kubernetes.io/component: "backend"
#   version: "v1"

# =============================================================================
# Annotations — maps so higher layers accumulate via Helm -f deep merge
# =============================================================================

deploymentAnnotations: {}
#   app.kubernetes.io/owner: "team-alpha"

podAnnotations: {}
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"

# =============================================================================
# Probes — all optional, only rendered if defined
# =============================================================================
# Each probe supports: httpGet, tcpSocket, exec, plus timing fields.
# Higher layers can override individual fields via Helm -f deep merge.
# =============================================================================

livenessProbe: {}
#   httpGet:
#     path: /healthz
#     port: http
#   initialDelaySeconds: 30
#   periodSeconds: 10
#   timeoutSeconds: 5
#   failureThreshold: 3

readinessProbe: {}
#   httpGet:
#     path: /ready
#     port: http
#   initialDelaySeconds: 5
#   periodSeconds: 10
#   timeoutSeconds: 5
#   failureThreshold: 3

startupProbe: {}
#   httpGet:
#     path: /healthz
#     port: http
#   initialDelaySeconds: 0
#   periodSeconds: 10
#   failureThreshold: 30

# =============================================================================
# ConfigMap & Secret references — injected as env vars via envFrom
# =============================================================================
# Uses a map (not a list) so Helm -f deep merge ADDS entries from higher layers.
#
# Options per ref:
#   optional: true   — pod won't fail if the resource doesn't exist yet
# =============================================================================

# =============================================================================
# Direct environment variables — injected into the container spec
# =============================================================================
# Uses a map so Helm -f deep merge ADDS entries from higher layers.
# Each entry maps an env var name to its value (string).
# For valueFrom (fieldRef, secretKeyRef, etc.) use a map instead of a string.
# =============================================================================

env: {}
#   LOG_LEVEL: "info"
#   APP_NAME: "my-app"
#   POD_NAME:
#     valueFrom:
#       fieldRef:
#         fieldPath: metadata.name

configMapRefs:
  app-config: {}

secretRefs:
  app-secrets: {}

# =============================================================================
# File mounts — mount individual keys from ConfigMaps/Secrets as files
# =============================================================================
# Uses a map so higher layers accumulate mounts via Helm -f deep merge.
#
# Structure:
#   configMapFiles:
#     <configmap-name>:
#       <key-in-configmap>: <mount-path-in-container>
#
#   secretFiles:
#     <secret-name>:
#       <key-in-secret>: <mount-path-in-container>
# =============================================================================

configMapFiles: {}
#   app-config:
#     application.yml: /etc/app/application.yml

secretFiles: {}
#   tls-certs:
#     tls.crt: /etc/ssl/certs/tls.crt
#     tls.key: /etc/ssl/certs/tls.key

# =============================================================================
# PVC mounts — mount pre-existing PersistentVolumeClaims
# =============================================================================
# Uses a map so higher layers accumulate mounts via Helm -f deep merge.
#
# Structure:
#   pvcMounts:
#     <pvc-name>:
#       mountPath: <mount-path-in-container>    (required)
#       subPath:   <sub-directory-in-pvc>       (optional)
#       readOnly:  true|false                   (optional, default false)
# =============================================================================

pvcMounts: {}
#   data-pvc:
#     mountPath: /data
#   logs-pvc:
#     mountPath: /var/log/app
#     subPath: backend
#     readOnly: true
