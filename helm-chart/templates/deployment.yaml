apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccountName }}
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- range $name, $val := .Values.env }}
            - name: {{ $name }}
              {{- if kindIs "map" $val }}
              {{- toYaml $val | nindent 14 }}
              {{- else }}
              value: {{ $val | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          envFrom:
            {{- range $name, $opts := .Values.configMapRefs }}
            - configMapRef:
                name: {{ $name }}
                {{- if $opts }}
                optional: {{ $opts.optional | default false }}
                {{- end }}
            {{- end }}
            {{- range $name, $opts := .Values.secretRefs }}
            - secretRef:
                name: {{ $name }}
                {{- if $opts }}
                optional: {{ $opts.optional | default false }}
                {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.configMapFiles .Values.secretFiles .Values.pvcMounts }}
          volumeMounts:
            {{- range $name, $items := .Values.configMapFiles }}
            {{- range $key, $mountPath := $items }}
            - name: cm-{{ $name }}
              mountPath: {{ $mountPath }}
              subPath: {{ $key }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- range $name, $items := .Values.secretFiles }}
            {{- range $key, $mountPath := $items }}
            - name: sec-{{ $name }}
              mountPath: {{ $mountPath }}
              subPath: {{ $key }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- range $name, $opts := .Values.pvcMounts }}
            - name: pvc-{{ $name }}
              mountPath: {{ $opts.mountPath }}
              {{- if $opts.subPath }}
              subPath: {{ $opts.subPath }}
              {{- end }}
              readOnly: {{ $opts.readOnly | default false }}
            {{- end }}
          {{- end }}
          {{- $res := include "app.resources" . -}}
          {{- if $res }}
          resources:
            {{- $res | nindent 12 }}
          {{- end }}
      {{- if or .Values.configMapFiles .Values.secretFiles .Values.pvcMounts }}
      volumes:
        {{- range $name, $_ := .Values.configMapFiles }}
        - name: cm-{{ $name }}
          configMap:
            name: {{ $name }}
        {{- end }}
        {{- range $name, $_ := .Values.secretFiles }}
        - name: sec-{{ $name }}
          secret:
            secretName: {{ $name }}
        {{- end }}
        {{- range $name, $opts := .Values.pvcMounts }}
        - name: pvc-{{ $name }}
          persistentVolumeClaim:
            claimName: {{ $name }}
            {{- if $opts.readOnly }}
            readOnly: true
            {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
