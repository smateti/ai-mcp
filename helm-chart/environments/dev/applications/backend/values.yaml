# Environment: dev | Application: backend
image:
  repository: myregistry/backend
  tag: "dev-latest"

containerPort: 8080

serviceAccountName: backend-sa

resourceSize: large

# Image pull secrets
imagePullSecrets:
  - name: myregistry-credentials

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Direct env vars
env:
  SPRING_PROFILES_ACTIVE: "dev"
  LOG_LEVEL: "debug"
  POD_NAME:
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

# Labels
deploymentLabels:
  app.kubernetes.io/component: "backend"
  app.kubernetes.io/part-of: "my-platform"
  team: "alpha"

podLabels:
  app.kubernetes.io/component: "backend"
  app.kubernetes.io/version: "dev-latest"

# Annotations
deploymentAnnotations:
  app.kubernetes.io/component: "backend"
  app.kubernetes.io/part-of: "my-platform"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Probes
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 30

configMapRefs:
  backend-config: {}
  db-config: {}

secretRefs:
  backend-secrets: {}
  db-secrets: {}

# Mount specific keys as files
configMapFiles:
  backend-config:
    application.yml: /etc/app/application.yml
    logback.xml: /etc/app/logback.xml
  db-config:
    db-migration.sql: /etc/db/db-migration.sql

secretFiles:
  db-secrets:
    ca.crt: /etc/ssl/db/ca.crt

# PVC mounts
pvcMounts:
  backend-data-pvc:
    mountPath: /data
  backend-logs-pvc:
    mountPath: /var/log/app
    subPath: backend
