---
# Source: app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-team-beta-prod-app
  labels:
    helm.sh/chart: app-0.1.0
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: frontend-team-beta-prod
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: app
      app.kubernetes.io/instance: frontend-team-beta-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/instance: frontend-team-beta-prod
    spec:
      containers:
        - name: app
          image: "myregistry/frontend:2.1.0"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - configMapRef:
                name: frontend-config
            - configMapRef:
                name: prod-config
            - configMapRef:
                name: team-beta-config
            - secretRef:
                name: app-secrets
            - secretRef:
                name: frontend-secrets
            - secretRef:
                name: prod-secrets
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
