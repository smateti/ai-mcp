---
# Source: app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-team-beta-dev-app
  labels:
    helm.sh/chart: app-0.1.0
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: frontend-team-beta-dev
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
      app.kubernetes.io/instance: frontend-team-beta-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/instance: frontend-team-beta-dev
    spec:
      containers:
        - name: app
          image: "myregistry/frontend:dev-latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - configMapRef:
                name: dev-config
            - configMapRef:
                name: frontend-config
            - configMapRef:
                name: team-beta-config
            - secretRef:
                name: app-secrets
            - secretRef:
                name: dev-secrets
            - secretRef:
                name: frontend-secrets
