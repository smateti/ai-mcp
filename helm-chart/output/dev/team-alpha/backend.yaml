---
# Source: app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-team-alpha-dev-app
  labels:
    helm.sh/chart: app-0.1.0
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: backend-team-alpha-dev
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: my-platform
    team: alpha
  annotations:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: my-platform
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: app
      app.kubernetes.io/instance: backend-team-alpha-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/instance: backend-team-alpha-dev
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: dev-latest
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    spec:
      imagePullSecrets:
        - name: myregistry-credentials
      serviceAccountName: backend-sa
      containers:
        - name: app
          image: "myregistry/backend:dev-latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
          envFrom:
            - configMapRef:
                name: app-config
            - configMapRef:
                name: backend-config
            - configMapRef:
                name: db-config
            - configMapRef:
                name: dev-config
            - configMapRef:
                name: team-alpha-config
            - secretRef:
                name: app-secrets
            - secretRef:
                name: backend-secrets
            - secretRef:
                name: db-secrets
            - secretRef:
                name: dev-secrets
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
          volumeMounts:
            - name: cm-backend-config
              mountPath: /etc/app/application.yml
              subPath: application.yml
              readOnly: true
            - name: cm-backend-config
              mountPath: /etc/app/logback.xml
              subPath: logback.xml
              readOnly: true
            - name: cm-db-config
              mountPath: /etc/db/db-migration.sql
              subPath: db-migration.sql
              readOnly: true
            - name: sec-db-secrets
              mountPath: /etc/ssl/db/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: pvc-backend-data-pvc
              mountPath: /data
              readOnly: false
            - name: pvc-backend-logs-pvc
              mountPath: /var/log/app
              subPath: backend
              readOnly: false
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: cm-backend-config
          configMap:
            name: backend-config
        - name: cm-db-config
          configMap:
            name: db-config
        - name: sec-db-secrets
          secret:
            secretName: db-secrets
        - name: pvc-backend-data-pvc
          persistentVolumeClaim:
            claimName: backend-data-pvc
        - name: pvc-backend-logs-pvc
          persistentVolumeClaim:
            claimName: backend-logs-pvc
