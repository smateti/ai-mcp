server:
  port: 8082

spring:
  application:
    name: cobol-service
  elasticsearch:
    uris: http://localhost:9200
  datasource:
    url: jdbc:h2:file:./data/cobol-service;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

llm:
  base-url: http://localhost:8000
  rag-model: llama3.1-8b-instruct
  embedding-model: nomic-embed-text
  timeout-seconds: 120
  temperature: 0.1
  max-tokens: 2048

qdrant:
  url: http://localhost:6333
  collection: cobol-analysis

batch:
  url: http://localhost:8081

logging:
  level:
    root: INFO
    com.enterprise.cobol: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
