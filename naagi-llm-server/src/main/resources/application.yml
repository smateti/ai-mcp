server:
  port: 8089

spring:
  application:
    name: naagi-llm-server
  datasource:
    url: jdbc:h2:file:./data/naagi-llm-server
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

naagi:
  llm:
    baseUrl: http://localhost:8000
    model: llama3.1
    timeout: 120
  agent:
    max-steps: 10
    default-system-prompt: >
      You are an intelligent assistant with access to tools. Your job is to answer the user's
      question by gathering information through available tools.
      RULES:
      1. Break complex questions into steps. Call multiple tools as needed.
      2. After receiving a tool result, decide silently whether to call another tool or provide the final answer.
      Do NOT narrate your reasoning.
      3. When you have ALL the information needed, provide ONLY the final answer directly.
      4. If a tool returns an error, briefly state the limitation.
      5. Never invent data. Only use information returned by tools.
      6. Keep your final answer well-structured, concise, and easy to read.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
