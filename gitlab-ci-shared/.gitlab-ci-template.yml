# ---------------------------------------------------------------------------
# .gitlab-ci-template.yml
#
# Reusable GitLab CI/CD pipeline template for deploying Nimbus framework
# web applications to OpenShift via helm template + oc apply.
#
# Usage — in your application repo's .gitlab-ci.yml:
#
#   include:
#     - project: 'DTF/framework/nimbus/gitlab-ci-shared'
#       ref: main
#       file: '.gitlab-ci-template.yml'
#
#   variables:
#     APP_NAME: "MyApp"
#
# Trigger the pipeline with variables: ENV_NAME, IMAGE_ID, MIG_RLS_NMBR
#
# Required CI/CD Variables (group or project level):
#   Per environment (prefix: DEV_, QA_, PROD_):
#     ${ENV}_OCP_URL              — OpenShift API server URL
#     ${ENV}_OCP_TOKEN            — OCP service account token (masked, protected)
#     ${ENV}_NIMBUS_PLUGIN_VER    — nimbus-maven-fwrkapp-plugin version
#     ${ENV}_SECURITY_PLUGIN_VER  — nimbus-maven-security-plugin version
#     ${ENV}_COMMON_PLUGIN_VER    — nimbus-devops-common-plugin version
#   Common:
#     ARTIFACT_URL                — artifact registry URL
# ---------------------------------------------------------------------------

variables:
  APP_NAME: ""
  ENV_NAME: ""
  IMAGE_ID: ""
  MIG_RLS_NMBR: ""
  ROLLOUT_TIMEOUT_SECONDS: "300"
  GIT_BRANCH: "main"

  # Git repo paths (override if repos are at different paths)
  STAGING_REPO_PATH: "DTF/framework/nimbus/nimbus-fwrkapp-staging"
  HELM_REPO_PATH: "DTF/framework/nimbus/devops/nimbus-devops-fwrk-overrides"
  HELM_DEFAULTS_PATH: "/default/"
  HELM_APPS_PATH: "/apps/"

  # Path to shared scripts (resolved automatically via include)
  SCRIPTS_DIR: "${CI_PROJECT_DIR}/.gitlab-ci-shared-scripts"

stages:
  - setup
  - deploy

# ---------------------------------------------------------------------------
# Setup stage — clone repos, validate image, discover namespace
# ---------------------------------------------------------------------------
setup:
  stage: setup
  image: ${CI_RUNNER_IMAGE}
  tags:
    - openshift
  before_script:
    # Fetch shared scripts from the template repo
    - |
      git clone --branch main --single-branch --depth 1 \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/DTF/framework/nimbus/gitlab-ci-shared.git" \
        "${SCRIPTS_DIR}"
      chmod +x "${SCRIPTS_DIR}/scripts/"*.sh
  script:
    - "${SCRIPTS_DIR}/scripts/setup-workspace.sh"
  artifacts:
    # dotenv artifact passes dynamic variables to downstream jobs
    reports:
      dotenv: deploy.env
    paths:
      - deploy.env
      - nimbus-staging-pom/
      - "${APP_NAME,,}-ocp-config/"
    expire_in: 1 hour
  rules:
    - if: '$APP_NAME == "" || $ENV_NAME == "" || $IMAGE_ID == ""'
      when: never
    - when: on_success

# ---------------------------------------------------------------------------
# Deploy stage — maven plugins, configmap, helm template, oc apply, rollout
# ---------------------------------------------------------------------------
.deploy_base:
  stage: deploy
  image: ${CI_RUNNER_IMAGE}
  tags:
    - openshift
  needs:
    - job: setup
      artifacts: true
  before_script:
    - |
      git clone --branch main --single-branch --depth 1 \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/DTF/framework/nimbus/gitlab-ci-shared.git" \
        "${SCRIPTS_DIR}"
      chmod +x "${SCRIPTS_DIR}/scripts/"*.sh
  script:
    - "${SCRIPTS_DIR}/scripts/deploy-app.sh"

# Dev/QA — deploy automatically
deploy:dev:
  extends: .deploy_base
  environment:
    name: dev
  rules:
    - if: '$ENV_NAME == "dev"'
      when: on_success

deploy:qa:
  extends: .deploy_base
  environment:
    name: qa
  rules:
    - if: '$ENV_NAME == "qa"'
      when: on_success

# Prod — manual approval required
deploy:prod:
  extends: .deploy_base
  environment:
    name: prod
  rules:
    - if: '$ENV_NAME == "prod"'
      when: manual
      allow_failure: false
