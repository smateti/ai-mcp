# Application policy - defines the app host and its own secrets

# Layer for grouping app hosts
- !layer

# Application host identity
- !host liberty-app

# Add host to the layer
- !grant
  role: !layer
  member: !host liberty-app

# Application-specific secrets
- &app-variables
  - !variable api-key
  - !variable app-name

# Grant the layer read access to app secrets
- !permit
  resource: *app-variables
  privileges: [ read, execute ]
  roles: !layer
