# Conjur connection settings (override via environment variables or server.xml)
conjur.appliance.url=http://localhost:8080
conjur.account=myConjurAccount
conjur.authn.login=host/myapp/liberty-app
conjur.authn.api.key=not-set

# Application defaults (will be overridden by Conjur secrets)
conjur.secret.db.username=default-user
conjur.secret.db.password=default-pass
conjur.secret.db.url=jdbc:db2://localhost:50000/empdb
conjur.secret.myapp.api-key=default-key
conjur.secret.myapp.app-name=db2-microprofile-app
