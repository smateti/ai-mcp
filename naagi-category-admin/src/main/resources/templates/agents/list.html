<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<th:block th:fragment="content">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h1><i class="bi bi-robot me-2"></i>Agents</h1>
        <a th:href="@{/agents/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>New Agent
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" th:if="${!#lists.isEmpty(agents)}">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Agent ID</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Tools</th>
                        <th>Skills</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="agent : ${agents}">
                        <td>
                            <a th:href="@{/agents/{id}(id=${agent['agentId']})}" class="text-decoration-none">
                                <strong th:text="${agent['name']}">Agent Name</strong>
                            </a>
                            <br>
                            <small class="text-muted" th:text="${#strings.abbreviate(agent['description'] ?: '', 60)}">Description</small>
                        </td>
                        <td><code th:text="${agent['agentId']}">50000</code></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${agent['agentType'] == 'INTERNAL'} ? 'bg-primary' : (${agent['agentType'] == 'EXTERNAL'} ? 'bg-purple' : 'bg-warning text-dark')"
                                  th:text="${agent['agentType']}">INTERNAL</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:if="${agent['categoryId'] != null}"
                                  th:text="${agent['categoryId']}">category</span>
                            <span class="text-muted" th:if="${agent['categoryId'] == null}">-</span>
                        </td>
                        <td><span class="badge bg-primary" th:text="${agent['tools'] != null ? agent['tools'].size() : 0}">0</span></td>
                        <td><span class="badge bg-info" th:text="${agent['skills'] != null ? agent['skills'].size() : 0}">0</span></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${agent['status'] == 'ACTIVE'} ? 'badge-active' : (${agent['status'] == 'MAINTENANCE'} ? 'bg-warning text-dark' : 'badge-inactive')"
                                  th:text="${agent['status']}">ACTIVE</span>
                        </td>
                        <td class="text-end">
                            <div class="d-flex justify-content-end gap-1">
                                <a th:href="@{/agents/{id}(id=${agent['agentId']})}" class="btn btn-sm btn-outline-primary" title="View Details">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/agents/{id}/edit(id=${agent['agentId']})}" class="btn btn-sm btn-outline-secondary" title="Edit" style="border-width: 2px;">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/agents/{id}/delete(id=${agent['agentId']})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to delete this agent?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="empty-state" th:if="${#lists.isEmpty(agents)}">
                <i class="bi bi-robot"></i>
                <p>No agents found</p>
                <a th:href="@{/agents/new}" class="btn btn-primary">Create First Agent</a>
            </div>
        </div>
    </div>

    <style>
        .bg-purple { background-color: #6f42c1 !important; color: white; }
    </style>
</th:block>
</html>
