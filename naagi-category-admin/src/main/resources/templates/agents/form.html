<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<th:block th:fragment="content">
    <div class="page-header">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/agents}">Agents</a></li>
                <li class="breadcrumb-item active" th:text="${agent['agentId'] != null} ? 'Edit' : 'New'">Form</li>
            </ol>
        </nav>
        <h1 th:text="${agent['agentId'] != null} ? 'Edit Agent' : 'New Agent'">Agent Form</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="${agent['agentId'] != null} ? @{/agents/{id}(id=${agent['agentId']})} : @{/agents}"
                  method="post" id="agentForm">

                <!-- Basic Info -->
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name"
                               th:value="${agent['name']}" required placeholder="e.g. Batch Operations Agent">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="agentType" class="form-label">Agent Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="agentType" name="agentType" required onchange="toggleExternalFields()">
                            <option value="INTERNAL" th:selected="${agent['agentType'] == 'INTERNAL'}">INTERNAL</option>
                            <option value="EXTERNAL" th:selected="${agent['agentType'] == 'EXTERNAL'}">EXTERNAL</option>
                            <option value="COMPOSITE" th:selected="${agent['agentType'] == 'COMPOSITE'}">COMPOSITE</option>
                        </select>
                        <small class="text-muted">Internal runs in orchestrator, External connects via A2A</small>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="description" name="description" rows="2" required
                              placeholder="LLM-consumable description for coordinator agent selection"
                              th:text="${agent['description']}"></textarea>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Role / Personality</label>
                    <textarea class="form-control" id="role" name="role" rows="3"
                              placeholder="Behavioral instructions injected into the agent's system prompt"
                              th:text="${agent['role']}"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="categoryId" class="form-label">Category</label>
                        <select class="form-select" id="categoryId" name="categoryId">
                            <option value="">-- Platform-level (no category) --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}"
                                    th:text="${cat.name}" th:selected="${cat.id == agent['categoryId']}">Category</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="documentAccess" class="form-label">Document Access</label>
                        <select class="form-select" id="documentAccess" name="documentAccess">
                            <option value="AUTO" th:selected="${agent['documentAccess'] == 'AUTO' || agent['documentAccess'] == null}">AUTO</option>
                            <option value="NONE" th:selected="${agent['documentAccess'] == 'NONE'}">NONE</option>
                            <option value="CUSTOM" th:selected="${agent['documentAccess'] == 'CUSTOM'}">CUSTOM</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="ACTIVE" th:selected="${agent['status'] == 'ACTIVE' || agent['status'] == null}">ACTIVE</option>
                            <option value="INACTIVE" th:selected="${agent['status'] == 'INACTIVE'}">INACTIVE</option>
                            <option value="MAINTENANCE" th:selected="${agent['status'] == 'MAINTENANCE'}">MAINTENANCE</option>
                        </select>
                    </div>
                </div>

                <!-- External Agent Fields -->
                <div id="externalFields" style="display: none;">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="endpoint" class="form-label">A2A Endpoint URL</label>
                            <input type="url" class="form-control" id="endpoint" name="endpoint"
                                   th:value="${agent['endpoint']}" placeholder="https://external-agent.example.com/a2a">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="healthCheckUrl" class="form-label">Health Check URL</label>
                            <input type="url" class="form-control" id="healthCheckUrl" name="healthCheckUrl"
                                   th:value="${agent['healthCheckUrl']}" placeholder="https://external-agent.example.com/health">
                        </div>
                    </div>
                </div>

                <!-- Behavioral Settings -->
                <h6 class="mt-4 mb-3 text-muted"><i class="bi bi-gear me-1"></i>Behavioral Settings</h6>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label for="maxSteps" class="form-label">Max Steps</label>
                        <input type="number" class="form-control" id="maxSteps" name="maxSteps"
                               th:value="${agent['maxSteps'] ?: 10}" min="1" max="50">
                    </div>
                    <div class="col-md-3 mb-3 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="planningEnabled" name="planningEnabled"
                                   th:checked="${agent['planningEnabled'] != false}">
                            <label class="form-check-label" for="planningEnabled">Planning</label>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="reflectionEnabled" name="reflectionEnabled"
                                   th:checked="${agent['reflectionEnabled'] != false}">
                            <label class="form-check-label" for="reflectionEnabled">Reflection</label>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3 d-flex align-items-end">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="parallelToolCalls" name="parallelToolCalls"
                                   th:checked="${agent['parallelToolCalls'] != false}">
                            <label class="form-check-label" for="parallelToolCalls">Parallel Tools</label>
                        </div>
                    </div>
                </div>

                <!-- Advanced -->
                <div class="mb-3">
                    <a class="text-muted text-decoration-none" data-bs-toggle="collapse" href="#advancedSection">
                        <i class="bi bi-chevron-down me-1"></i>Advanced Settings
                    </a>
                    <div class="collapse mt-2" id="advancedSection">
                        <label for="systemPromptOverride" class="form-label">System Prompt Override</label>
                        <textarea class="form-control font-monospace" id="systemPromptOverride" name="systemPromptOverride"
                                  rows="5" placeholder="Leave empty to use the default system prompt"
                                  th:text="${agent['systemPromptOverride']}"></textarea>
                        <small class="text-muted">Overrides the entire system prompt. Use with caution.</small>
                    </div>
                </div>

                <!-- Active toggle -->
                <div class="mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="active" name="active"
                               th:checked="${agent['active'] != false}">
                        <label class="form-check-label" for="active">Active</label>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-2"></i>
                        <span th:text="${agent['agentId'] != null} ? 'Update' : 'Create'">Save</span>
                    </button>
                    <a th:href="@{/agents}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleExternalFields() {
            const type = document.getElementById('agentType').value;
            document.getElementById('externalFields').style.display = type === 'EXTERNAL' ? '' : 'none';
        }
        // Initialize on load
        toggleExternalFields();
    </script>
</th:block>
</html>
